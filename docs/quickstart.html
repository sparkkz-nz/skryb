# Skryb Quickstart

**Skryb** turns standard Markdown and simple YAML diagram blocks into an ordinary
HTML file, viewable in any browser. The canonical Markdown and YAML source remains
inside the file; the browser runtime renders them into a readable, editable document
and saves updated copies.


:::grid { columns=2 }
:::panel { title="What you need" palette=accent-soft }
A modern browser and one HTML file. The default file uses an online-hosted
runtime, keeping the document small. Use **Save for Offline** to embed the
runtime and make the document truly standalone.
:::

:::panel { title="This is a Skryb Document" palette=accent-soft}
Use the document menu to change the theme. Open the built-in editor with
shift-cmd/ctrl-E and explore the source, make live changes, and save a copy
locally. Open a diagram editor to drag, drop, add and edit nodes and connectors.
Explore, and have fun!
:::
:::

## Designed so that Agents and Humans can work together

While its easy to start with the [basic document template](https://sparkkz-nz.github.io/skryb/templates/skryb-document-template.html)
and add some standard markdown or yaml diagram blocks, the real power of **Skryb**
comes when your agent is given the [skills](https://sparkkz-nz.github.io/skryb/docs/quickstart.html#use-skryb-with-coding-agents) to use it.
Let your agents generate beautifil documentation for you, and then jump in with tweaks and
edits as needed.

## Create and open a document

1. [Download the basic document template](https://sparkkz-nz.github.io/skryb/templates/skryb-document-template.html).
   It has a title, introductory text, and editable flowchart.
2. Open the downloaded file directly in a browser, including through a local
   `file://` URL.
3. Choose **Edit source** in the document menu to replace the template content,
   then use **Save As** whenever you want a new document.
4. To start from scratch instead, use the HTML shell in the
   [reference](https://sparkkz-nz.github.io/skryb/docs/reference.html#html-document-shell). Put Markdown and diagram
   YAML in `template#source`; keep
   `main#rendered-document` empty.

Frontmatter controls document-wide style. `theme: auto` follows the viewer's
system setting; `light` and `dark` are fixed choices. Select `classic`, `ice`,
`midnight`, or `paper` with `colourScheme`. The document menu can change either
setting and writes the result back to frontmatter when you save.

## Add a flowchart

This flowchart is YAML in the document source. It shows a browser submitting an
order to an API. Flowchart edit mode can change node and connector presentation,
resize or duplicate nodes, reconnect edges, and drag a selected edge waypoint.

```diagram
type: flowchart
version: 1
id: first-flowchart
canvas:
  width: 720
  height: 300
nodes:
  - id: browser
    label: Browser
    shape: rounded-rectangle
    position: { x: 60, y: 110 }
    size: { width: 180, height: 80 }
    palette: accent
  - id: api
    label: Orders API
    shape: oval
    position: { x: 450, y: 110 }
    size: { width: 180, height: 80 }
    palette: success
  - id: order-note
    label: |+
      ## Order request
      **Authenticated** customer call
    shape: text
    position: { x: 390, y: 18 }
    size: { width: 260, height: 70 }
edges:
  - source: browser
    target: api
    sourceAnchor: right
    targetAnchor: left
    label: POST /orders
    route: orthogonal
    end: arrow
```

Use the diagram toolbar to zoom, fit, or pan. Panning is visual only: it does
not alter the stored node and waypoint coordinates. A diagram frame sizes
itself to its drawn shapes on first render; drag the frame's bottom edge to
change that height, or press **Zoom to fit** to restore it. Choose **Edit** to
make flowchart changes, then keep the edit to serialize them back into the
matching diagram fence.

Use the **text** shape for diagram annotations. Its existing **Label** editor
accepts multiple lines and supports `# Heading`, `## Subheading`, `**bold**`,
_italic_, and ``code`` formatting. A text shape is transparent by default;
apply any palette, including **None**, to change or remove a shape's fill and
stroke. See the [reference](https://sparkkz-nz.github.io/skryb/docs/reference.html#the-text-shape-and-its-markdown-subset)
for the complete text-node syntax.

## Export a diagram

Each diagram toolbar has an **Export** menu:

- **Open full diagram** opens the diagram alone in a new browser tab.
- **Save as SVG** downloads a standalone, scalable vector image that can be
  opened in a browser or compatible graphics application.
- **Print / Save as PDF** opens the browser's native print dialog for the
  diagram alone.

Exports retain the current theme background and diagram font, but omit editor
controls as well as the current zoom and pan position.

## Edit canonical source

**Edit source**, or Cmd/Ctrl+Shift+E, opens the resizable source tray. Drag its
top edge to change the tray height, or focus that edge and use the arrow keys;
double-click it to restore the default height. It live-renders valid changes,
while preserving the last valid document and showing a precise error for an
invalid draft. Double-click rendered text to open the tray at its matching
source. Double-click and drag a text selection for more search precision.

The tray menu inserts valid templates for a flowchart, sequence, diagram
reference, panel, or grid. Use it for document structure and all sequence
diagram changes; sequence participants appear left to right and messages appear
top to bottom in source order.

## Save the result

- **Save As** downloads an updated portable HTML document and retains its hosted
  runtime URL.
- **Save for Offline** downloads a self-contained HTML document with the
  selected runtime embedded at the end of its body.
- Cmd/Ctrl+S saves the latest valid source; Cmd/Ctrl+Shift+E opens or closes the
  source tray.

## Keep going

- Read the [Skryb reference](https://sparkkz-nz.github.io/skryb/docs/reference.html) for the supported document,
  formatting, flowchart, and sequence fields.

## Use Skryb with coding agents

Install the schema-aware `skryb-document` skill to make this authoring contract
available to every supported local agent:

```sh
npx skills add sparkkz-nz/skryb --skill skryb-document --agent '*' --global --yes --full-depth
```

Omit `--global` for a project-only install. Run `npx skills update --global` to
receive the latest version. The [skill source](https://github.com/sparkkz-nz/skryb/tree/main/.github/skills/skryb-document)
is versioned alongside Skryb.
