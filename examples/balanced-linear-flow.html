# Balanced linear flow demonstration

This deliberately unbalanced diagram contains ten consecutive processing stages
in one horizontal line. Choose **Check document**, then select **Wrap this
horizontal flow** to preview and apply the explicit balanced-layout fix. An
authoring agent can instead inspect `?skryb=lint`, then load
`?skryb=autowrap` and extract the updated `template#source`.
