# Skryb codebase architecture

> **Skryb** is a browser runtime for portable, editable technical documents. An HTML file keeps Markdown and diagram YAML as its canonical source; the runtime renders the source into an interactive document, writes intentional edits back to that source, and can export a self-contained copy.

:::toc { depth=2 diagrams=true }

:::grid { columns="2fr 1fr" }
:::panel { title="At a glance" palette=accent }
The codebase is deliberately compact and layered:

1. **Core** parses, validates, lays out, serializes, and lints document models.
2. **Renderers** turn those models into accessible HTML and SVG.
3. **Browser editor** coordinates state, interactions, persistence, and export.

The browser entry point is `src/index.ts`: it creates `BrowserRuntime` and calls `boot()`. Repository tooling and focused tests use the separate internal entry point at `src/core/index.ts`.
::: (at a glance)

:::stack
:::callout { kind=success title="Design centre" palette=success }
Markdown is the durable source of truth. The viewer is not a server application or a document database.
::: (design centre)

:::panel { title="Repository surfaces" palette=note }
`src/` contains the runtime and internal core entry point; `scripts/` expose bake and lint commands; `test/` contains focused core suites and browser-artifact smoke coverage; `pages/` publishes the project site.
::: (repository surfaces)
::: (supporting stack)
::: (overview grid)

## Architecture and module boundaries

Figure {ref=runtime-architecture} follows the dependency direction from document source to the browser experience. The diagram separates pure model work from DOM-facing code: this lets `scripts/bake.mjs`, `scripts/lint.mjs`, and focused tests import the internal ESM core directly, without constructing a browser runtime.

:::diagram { id=runtime-architecture }

:::grid { columns=3 }
:::panel { title="1. Document model" palette=pale }
**`core/document.ts`** owns frontmatter, canonical source validation, fence extraction, source hashing, and baking. **`core/markdown.ts`** turns supported Markdown and Skryb directives into HTML, resolving figure references and the contents list.
::: (document model)

:::panel { title="2. Diagram engine" palette=pale }
**`core/diagrams/parser.ts`** validates YAML into typed flowchart or sequence models. Layout, routing, hierarchy, geometry, styles, mutations, and serialization then keep the diagram consistent and editable.
::: (diagram engine)

:::panel { title="3. Runtime and UI" palette=pale }
**`BrowserRuntime`** in `editor/orchestrator.ts` owns the render cycle. **`DiagramEditor`**, **`SourceEditor`**, and the inspector translate browser actions into core mutations and canonical-source updates.
::: (runtime and UI)
::: (module grid)

### Main responsibilities

| Area | Key modules and symbols | Contract with the rest of Skryb |
| --- | --- | --- |
| Bootstrap | `src/index.ts`, `BrowserRuntime.boot()` | Finds `template#source` and `main#rendered-document`, creates the runtime, and publishes only the small `DocDiagramCore` compatibility surface. |
| Document core | `resolveDocument()`, `validateDocumentSource()`, `bakeDocumentSource()` | Treats embedded Markdown as canonical and controls safe frontmatter/fence semantics. |
| Markdown core | `renderMarkdown()`, `renderInline()` | Renders supported CommonMark/GFM constructs and structured directives; delegates diagrams to the runtime. |
| Diagram core | `parseDiagram()`, `applyFlowchartLayout()`, `buildEdgePath()`, `serializeDiagram()` | Converts YAML into models, completes geometry, avoids obstacles, and writes the result back to YAML. |
| Quality gate | `lintDocument()` | Reports schema errors plus reader-visible overlap, crossing, and label-overflow warnings. |
| Renderers | `renderDiagramSource()`, `renderFlowchartDiagram()`, `renderSequenceDiagram()` | Renders parsed models to interactive SVG figures with toolbars and captions. |
| Editing and export | `SourceEditor`, `DiagramEditor`, `offline-document.ts` | Preserves valid edits, updates only canonical source, and creates portable hosted or offline files. |

## Document render and bake flow

The high-value path is shown in Figure {ref=render-and-bake}. It uses the same core functions whether a document opens in a browser or repository tooling imports the internal ESM entry point. Auto-layout is intentionally a **seeding** step: it fills only missing positions and anchors, so later graphical adjustments stay authoritative.

:::diagram { id=render-and-bake }

:::callout { kind=info title="Why this separation matters" palette=note }
The core does not need the DOM to parse, lay out, serialize, or lint a document. DOM concerns—menus, focus, event wiring, viewport fitting, and downloaded files—stay at the edge in the browser runtime.
::: (separation)

## Browser interaction flow

Figure {ref=editor-round-trip} shows how an editor action remains reversible and source-first. The diagram renderer captures a typed model; the editing layer uses focused mutations instead of directly patching SVG; `BrowserRuntime.persistDiagramModels()` serializes the complete model back into its original fenced block.

:::diagram { id=editor-round-trip }

:::grid { columns=2 }
:::panel { title="Diagram editing" palette=accent-soft }
`DiagramEditor` enables canvas panning, zooming, selection, dragging, resizing, reconnection, and inline labels for flowcharts. It uses functions such as `createNode()`, `resizeFlowchartNode()`, and `reconnectConnector()` from `core/diagrams/mutations.ts`.
::: (diagram editing)

:::panel { title="Source editing" palette=accent-soft }
`SourceEditor` owns the tray, debounced live rendering, validation failures, source-to-render navigation, insertion templates, and importing diagrams from HTML or Markdown files.
::: (source editing)
::: (editing grid)

## What keeps the document portable

:::grid { columns="1fr 2fr" }
:::panel { title="Hosted document" palette=highlight }
The normal shell loads `skryb-runtime.js` from the `latest` or a release URL. **Save As** keeps that external URL, so documents stay small and can be opened directly from local storage.
::: (hosted document)

:::panel { title="Offline document" palette=highlight }
`getRuntimeSourceForOfflineExport()` obtains the packaged or fetched runtime. `embedRuntimeInDocumentHtml()` replaces the marked external script with an escaped inline runtime at the end of `<body>`. Errors surface if a safe complete export cannot be made.
::: (offline document)
::: (portability grid)

### Tooling alignment

The build produces an internal ESM core module for repository tooling and focused tests. `bake.mjs` imports `bakeDocumentSource()` directly, then splices only changed diagram fences into the original HTML. `lint.mjs` imports `lintDocument()` directly and fails only on errors, leaving visual warnings advisory. Focused suites import the same core boundaries without evaluating the browser runtime; a small smoke suite still executes each browser artifact.

:::callout { kind=success title="Reading guide" palette=success }
Start with Figure {ref=runtime-architecture} for ownership, then Figure {ref=render-and-bake} for the generated-document lifecycle, and Figure {ref=editor-round-trip} for the interactive edit round trip.
::: (reading guide)
